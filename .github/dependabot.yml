# Keeps the pipeline's own dependencies patched: GitHub Actions, Terraform providers, Python tools.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directories: [/bootstrap, /service]
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
