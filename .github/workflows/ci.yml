# CI: every pull request gets the shared checks, then a Terraform plan posted as a PR comment.
# Nothing here can change AWS. The plan job uses a read-only role.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  TF_VERSION: "1.10.5"
  TF_IN_AUTOMATION: "true"
  AWS_REGION: us-east-2

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  plan:
    name: Terraform plan → PR comment
    if: github.event.pull_request.head.repo.full_name == github.repository  # forks get no AWS access
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # lets GitHub mint the OIDC token AWS trusts
      pull-requests: write  # to post the plan
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: pr-${{ github.event.pull_request.number }}-plan
          aws-region: ${{ env.AWS_REGION }}
      - name: Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=service/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: Plan
        env:
          TF_VAR_commit_sha: ${{ github.event.pull_request.head.sha }}
          TF_VAR_boundary_arn: ${{ vars.BOUNDARY_POLICY_ARN }}
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock-timeout=2m -out=tfplan
          terraform show -no-color tfplan > plan.txt
      - name: Comment the plan on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('service/plan.txt', 'utf8');
            const summary = (plan.match(/Plan: .*|No changes\..*/) || ['(see log)'])[0];
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (truncated, full plan in the job log)';
            const marker = '<!-- tf-plan -->';
            const body = `${marker}\n### 🗺️ Terraform plan — \`${summary}\`\n` +
              `Commit \`${context.payload.pull_request.head.sha.slice(0, 7)}\` · read-only role · nothing has been changed yet\n\n` +
              `<details><summary>Show plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n</details>`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
