[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"service/tests/*" = ["S101"]  # assert is how pytest works
"service/src/app.py" = ["E501"]  # the status page's inline CSS/HTML

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
pythonpath = ["service/src"]
testpaths = ["service/tests"]
